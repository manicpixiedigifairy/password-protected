<!-- Password Protected loader: Victoria's Secret spec case study.
     Paste into a Readymag Code widget (Widget Code, Use iFrame off) or a Squarespace Code block.
     It pulls the newest commit of the page straight from this GitHub repo,
     so every push shows up here without touching the site builder.
     Order it tries: newest commit via jsDelivr, then the main branch via jsDelivr, then the Netlify site. -->
<div style="position:fixed;inset:0;z-index:2147483000;background:#0E0B0D">
  <iframe id="pp-password-protected"
          title="Password Protected: Victoria's Secret spec case study"
          style="display:block;width:100%;height:100%;border:0"
          allow="fullscreen"></iframe>
</div>
<script>
(function () {
  var REPO = 'manicpixiedigifairy/password-protected', PAGE = 'password-protected';
  var NETLIFY_URL = 'https://victoriassecretjournal.netlify.app/';
  var frame = document.getElementById('pp-password-protected');
  if (!frame) return;

  function show(base, html) {
    /* point relative asset paths (assets/...) at the same commit */
    var tag = '<base href="' + base + '">';
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + tag; }) : tag + html;
    frame.srcdoc = html;
  }
  function load(ref) {
    var base = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + ref + '/' + PAGE + '/';
    return fetch(base + 'index.html', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('jsDelivr ' + r.status);
      return r.text();
    }).then(function (html) { show(base, html); });
  }

  fetch('https://api.github.com/repos/' + REPO + '/commits/main', { headers: { Accept: 'application/vnd.github+json' } })
    .then(function (r) { if (!r.ok) throw new Error('api ' + r.status); return r.json(); })
    .then(function (c) { return load(c.sha); })
    .catch(function () { return load('main'); })
    .catch(function () { frame.src = NETLIFY_URL + '?v=' + Date.now(); });
})();
</script>
